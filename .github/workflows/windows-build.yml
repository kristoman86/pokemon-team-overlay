name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pokemon_team.py"
      - "requirements-build.txt"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Test source app
        run: |
          python -m unittest -q
          python pokemon_team.py --self-test

      - name: Build portable EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name Pokemon-Team-Overlay pokemon_team.py

      - name: Test built EXE
        run: .\dist\Pokemon-Team-Overlay.exe --self-test

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Team-Overlay-Windows
          path: dist/Pokemon-Team-Overlay.exe
          if-no-files-found: error
